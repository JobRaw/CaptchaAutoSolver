<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>验证码识别助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">
        <div class="icon-glow">⚡</div>
        <span class="title">Captcha Solver</span>
      </div>
      <span class="badge">Local OCR</span>
    </div>

    <div class="status-box">
      <div class="status-indicator active" id="statusDot"></div>
      <div class="status-info">
        <span class="status-title" id="statusText">自动识别服务工作正常</span>
        <span class="status-desc">运行模式: 本地 OCR + 滑动拼图识别</span>
      </div>
    </div>

    <div class="control-group" style="margin-bottom: 12px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;">
      <div class="control-row" style="margin-bottom: 8px;">
        <span style="font-size: 13px;">启用无感自动填入</span>
        <label class="switch"><input type="checkbox" id="toggleEnabled" checked><span class="slider"></span></label>
      </div>
      <div class="control-row" style="margin-bottom: 8px;">
        <span style="font-size: 13px;">启用 V1 (2D极坐标)</span>
        <label class="switch"><input type="checkbox" id="toggleV1" checked><span class="slider"></span></label>
      </div>
      <div class="control-row" style="margin-bottom: 8px;">
        <span style="font-size: 13px;">启用 V2 (1D方差轮廓)</span>
        <label class="switch"><input type="checkbox" id="toggleV2" checked><span class="slider"></span></label>
      </div>
      <div class="control-row" style="margin-bottom: 8px;">
        <span style="font-size: 13px;">启用 V3 (纯色彩 ZNCC)</span>
        <label class="switch"><input type="checkbox" id="toggleV3" checked><span class="slider"></span></label>
      </div>
      <div class="control-row">
        <span style="font-size: 13px; color: #fbbf24;">开启全数据收集(打出详细日志)</span>
        <label class="switch"><input type="checkbox" id="toggleCollect" checked><span class="slider"></span></label>
      </div>
      <div class="control-row" style="margin-top: 12px; justify-content: center;">
        <button id="openMemoryBtn" style="width: 100%; padding: 6px; background: rgba(59, 130, 246, 0.2); border: 1px solid rgba(59, 130, 246, 0.5); color: #93c5fd; border-radius: 4px; cursor: pointer; font-size: 13px; transition: all 0.2s;">🧠 查看 / 管理图像记忆库</button>
      </div>
      <div class="control-row" style="margin-top: 8px; justify-content: center; flex-direction: column; gap: 4px; align-items: stretch;">
        <button id="addDomainBtn" style="width: 100%; padding: 6px; background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.5); color: #6ee7b7; border-radius: 4px; cursor: pointer; font-size: 13px; transition: all 0.2s;">➕ 一键添加当前域名至白名单</button>
        <span id="currentDomainText" style="font-size: 11px; color: #94a3b8; text-align: center;">...</span>
      </div>
    </div>

    <div class="footer">
      <button class="btn btn-secondary" id="openOptions">⚙️ 自定义匹配规则</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
