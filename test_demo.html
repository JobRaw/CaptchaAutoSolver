<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>验证码自动识别 - 本地调试测试页</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    .login-card {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 32px;
      width: 360px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h2 {
      margin-top: 0;
      font-size: 20px;
      margin-bottom: 8px;
    }
    p.desc {
      color: var(--subtext);
      font-size: 13px;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: rgba(15,23,42,0.8);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px 14px;
      color: white;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
    }
    .captcha-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .captcha-img-wrap {
      cursor: pointer;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: #4f46e5;
    }
    .result-message {
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>系统登录调试</h2>
    <p class="desc">打开此页面后，Chrome 插件将毫秒级无感识别验证码并填入输入框。</p>
    
    <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" value="developer_test" required>
      </div>

      <div class="form-group">
        <label>密码</label>
        <input type="password" value="12345678" required>
      </div>

      <div class="form-group">
        <label>图形验证码 (点击图片刷新)</label>
        <div class="captcha-row">
          <input type="text" id="captcha-input" name="code" placeholder="请输入验证码" autocomplete="off" required>
          <div class="captcha-img-wrap" title="点击刷新验证码">
            <img id="captcha-img" src="" alt="验证码" width="120" height="40">
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit">立即登录</button>
      <div class="result-message" id="msg"></div>
    </form>
  </div>

  <script>
    let currentCode = '';

    function generateCaptcha() {
      const canvas = document.createElement('canvas');
      canvas.width = 120;
      canvas.height = 40;
      const ctx = canvas.getContext('2d');

      // 背景
      ctx.fillStyle = '#f1f5f9';
      ctx.fillRect(0, 0, 120, 40);

      // 干扰线
      for (let i = 0; i < 4; i++) {
        ctx.strokeStyle = `hsl(${Math.random() * 360}, 70%, 50%)`;
        ctx.beginPath();
        ctx.moveTo(Math.random() * 120, Math.random() * 40);
        ctx.lineTo(Math.random() * 120, Math.random() * 40);
        ctx.stroke();
      }

      // 生成 4 位验证码字符
      const chars = '23456789abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ';
      currentCode = '';
      for (let i = 0; i < 4; i++) {
        const char = chars[Math.floor(Math.random() * chars.length)];
        currentCode += char;
        ctx.fillStyle = `hsl(${Math.random() * 360}, 80%, 30%)`;
        ctx.font = 'bold 22px Arial';
        ctx.fillText(char, 15 + i * 25, 28 + (Math.random() * 6 - 3));
      }

      const imgEl = document.getElementById('captcha-img');
      imgEl.src = canvas.toDataURL();
      imgEl.setAttribute('data-code', currentCode);
    }

    document.getElementById('captcha-img').addEventListener('click', generateCaptcha);
    window.onload = generateCaptcha;

    function handleLogin() {
      const inputVal = document.getElementById('captcha-input').value.trim();
      const msgEl = document.getElementById('msg');
      if (inputVal.toLowerCase() === currentCode.toLowerCase()) {
        msgEl.style.color = '#34d399';
        msgEl.innerText = '🎉 验证码匹配正确！登录成功！';
      } else {
        msgEl.style.color = '#f87171';
        msgEl.innerText = `❌ 验证码不匹配 (期望: ${currentCode}, 输入: ${inputVal})`;
      }
    }
  </script>
</body>
</html>
